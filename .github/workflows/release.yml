name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Setup Node.js for Vite
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. Install frontend deps and build with Vite
      - name: Build frontend with Vite
        working-directory: frontend
        run: |
          npm run build:client

      # 5. Copy built frontend into backend
      - name: Copy frontend build
        run: |
          rm -rf backend/frontend
          mkdir -p backend/frontend
          cp -r frontend/dist/* backend/frontend/

      # 6. Install Python dependencies
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pyinstaller

      # 7. Build backend with PyInstaller
      - name: PyInstaller build
        working-directory: backend
        run: pyinstaller --clean ann.spec

      # 8. Package artifacts
      - name: Package release
        run: |
          cd backend/dist
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            tar -czvf ann-${{ github.ref_name }}-linux-x86_64.tar.gz ann
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            tar -czvf ann-${{ github.ref_name }}-macos-x86_64.tar.gz ann
          else
            powershell Compress-Archive -Path ann -DestinationPath ann-${{ github.ref_name }}-windows-x86_64.zip
          fi

      # 9. Upload artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ann-${{ matrix.os }}
          path: |
            backend/dist/*.tar.gz
            backend/dist/*.zip

    # 10. Upload to GitHub Release (Assets)
      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            backend/dist/*.tar.gz
            backend/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}